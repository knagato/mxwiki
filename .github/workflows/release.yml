name: Release

# Push a tag vX.Y.Z (matching cli/src/mxwiki/__init__.py and widget/package.json).
# Publishes: the widget tarball on the GitHub Release, ghcr.io/knagato/mxwiki,
# and the CLI on PyPI via Trusted Publishing (configure the "pypi" environment
# and the trusted publisher on pypi.org first; see CONTRIBUTING.md).
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        name: Tag matches package versions
        run: |
          tag="${GITHUB_REF_NAME#v}"
          py=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' cli/src/mxwiki/__init__.py)
          js=$(node -p 'require("./widget/package.json").version')
          echo "tag=$tag cli=$py widget=$js"
          [ "$tag" = "$py" ] && [ "$tag" = "$js" ]
          echo "version=$tag" >> "$GITHUB_OUTPUT"
      - run: scripts/check-no-upstream-names.sh

  widget:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: widget/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: widget/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile && pnpm build
        working-directory: widget
      - name: Tarball
        run: tar -czf "mxwiki-widget-${GITHUB_REF_NAME}.tar.gz" -C widget/dist .
      - uses: softprops/action-gh-release@v2
        with:
          files: mxwiki-widget-${{ github.ref_name }}.tar.gz
          generate_release_notes: true

  image:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/knagato/mxwiki
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  pypi-build:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv build cli --out-dir dist
      - uses: actions/upload-artifact@v4
        with:
          name: pypi-dist
          path: dist/

  pypi-publish:
    needs: pypi-build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/mxwiki
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pypi-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
