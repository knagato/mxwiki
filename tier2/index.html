<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MyWiki 🔒 (Tier2: 暗号化)</title>
<style>
  :root { --bg:#fff; --fg:#1b1b1f; --muted:#6b6b76; --line:#e3e3ea; --accent:#6d28d9; --sidebar:#f7f7fa; }
  @media (prefers-color-scheme: dark){
    :root { --bg:#16161a; --fg:#e7e7ea; --muted:#9a9aa5; --line:#2b2b33; --accent:#a78bfa; --sidebar:#1d1d22; }
  }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.6 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Segoe UI",sans-serif; color:var(--fg); background:var(--bg); }
  .panel { max-width:420px; margin:10vh auto; padding:24px; }
  .panel h1 { font-size:20px; }
  label { display:block; margin:12px 0 4px; font-size:13px; color:var(--muted); }
  input { width:100%; padding:9px 11px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--fg); font-size:14px; }
  button { cursor:pointer; border:1px solid var(--line); background:var(--bg); color:var(--fg); padding:8px 14px; border-radius:8px; font-size:14px; }
  button.primary { background:var(--accent); color:#fff; border-color:transparent; }
  button:disabled { opacity:.5; cursor:default; }
  .badge{font-size:11px;background:var(--accent);color:#fff;padding:2px 7px;border-radius:10px;}
  .err { color:#c92a2a; font-size:13px; margin-top:8px; min-height:18px; white-space:pre-wrap; }
  .muted { color:var(--muted); }
  #app { display:none; grid-template-columns:260px 1fr; height:100vh; }
  #sidebar { background:var(--sidebar); border-right:1px solid var(--line); display:flex; flex-direction:column; }
  #sidebar header { padding:14px 16px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:8px; justify-content:space-between; }
  #pages { list-style:none; margin:0; padding:6px; overflow:auto; flex:1; }
  #pages li { padding:8px 10px; border-radius:7px; cursor:pointer; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #pages li:hover { background:var(--line); }
  #pages li.active { background:var(--accent); color:#fff; }
  #sidebar footer { padding:10px 12px; border-top:1px solid var(--line); font-size:12px; color:var(--muted); display:flex; justify-content:space-between; align-items:center; gap:8px; }
  #main { display:flex; flex-direction:column; overflow:hidden; }
  #toolbar { padding:10px 20px; border-bottom:1px solid var(--line); display:flex; gap:8px; align-items:center; }
  #toolbar .title { font-weight:600; flex:1; }
  #view { padding:24px 32px; overflow:auto; flex:1; }
  #meta { font-size:12px; color:var(--muted); padding:0 32px 8px; word-break:break-all; }
  #editor { display:none; flex-direction:column; flex:1; padding:16px 20px; gap:10px; }
  #editor input.pgtitle { font-size:15px; }
  #editor textarea { flex:1; resize:none; padding:12px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--fg); font:13px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace; }
  .prose h1{font-size:26px;margin:.2em 0 .5em} .prose h2{font-size:20px;margin:1em 0 .4em}
  .prose code{background:var(--sidebar);padding:1px 5px;border-radius:4px;font-size:.9em}
  .prose pre{background:var(--sidebar);padding:12px;border-radius:8px;overflow:auto}
  .prose a{color:var(--accent)}
  #status { position:fixed; bottom:10px; right:12px; font-size:12px; color:var(--muted); }
</style>
</head>
<body>

<!-- ① ログイン -->
<div id="login" class="panel">
  <h1>MyWiki <span class="badge">🔒 Tier2</span></h1>
  <p class="muted" style="font-size:13px">E2EE ルームの暗号化 Wiki。本文も画像も matrix-js-sdk が暗復号します。</p>
  <label>ホームサーバー（空欄=このサイトと同一オリジン経由）</label>
  <input id="hs" value="">
  <label>ユーザー名 (@ の前だけ)</label>
  <input id="user" placeholder="knagato" autocomplete="username">
  <label>パスワード</label>
  <input id="pw" type="password" autocomplete="current-password">
  <label>ルーム ID または alias（暗号化ルーム）</label>
  <input id="room" value="!secretwiki:example.org">
  <div style="margin-top:16px"><button class="primary" id="loginBtn">ログイン</button></div>
  <div class="err" id="loginErr"></div>
</div>

<!-- ② 鍵の解錠（初回のみ: 回復キー / セキュリティフレーズ） -->
<div id="unlock" class="panel" style="display:none">
  <h1>🔑 鍵バックアップの解錠</h1>
  <p class="muted" style="font-size:13px">過去ページを復号するため、回復キーまたはセキュリティフレーズを入力してください。<br>（このブラウザでは初回のみ。以降は自動）</p>
  <label>回復キー または セキュリティフレーズ</label>
  <input id="recovery" type="password" placeholder="EsTx xxxx xxxx … もしくは パスフレーズ">
  <div style="margin-top:16px; display:flex; gap:8px">
    <button class="primary" id="unlockBtn">解錠</button>
    <button id="skipUnlockBtn">スキップ（新しい鍵で開始）</button>
  </div>
  <div class="err" id="unlockErr"></div>
</div>

<!-- ③ Wiki 本体 -->
<div id="app">
  <aside id="sidebar">
    <header><b>📖 MyWiki</b><span class="badge">🔒</span><button id="newBtn" title="新規ページ">＋</button></header>
    <ul id="pages"></ul>
    <footer><span id="whoami" class="muted"></span><button id="logoutBtn">ログアウト</button></footer>
  </aside>
  <section id="main">
    <div id="toolbar">
      <span class="title" id="curTitle"></span>
      <button id="editBtn">編集</button>
      <button class="primary" id="saveBtn" style="display:none">保存</button>
      <button id="cancelBtn" style="display:none">取消</button>
    </div>
    <div id="meta"></div>
    <div id="view" class="prose"></div>
    <div id="editor">
      <input class="pgtitle" id="edTitle" placeholder="ページタイトル">
      <div><button id="imgBtn" type="button">🖼 画像を挿入（暗号化）</button> <input type="file" id="imgFile" accept="image/*" style="display:none"> <span id="imgStatus" class="muted" style="font-size:12px"></span></div>
      <textarea id="edBody" placeholder="Markdown で本文を書く…"></textarea>
      <div class="err" id="saveErr"></div>
    </div>
  </section>
</div>

<div id="status"></div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
